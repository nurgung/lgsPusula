name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # Weekly run: new advisories for unchanged dependencies and a full-history secret scan.
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, tip, test ve build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    name: Uçtan uca testler
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start local Supabase (applies supabase/migrations)
        # Auth tests need the database, Auth, API gateway, and PostgREST.
        # Studio, storage, and analytics are unused and often fail the health check.
        run: npx supabase start --yes -x studio,imgproxy,mailpit,realtime,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Export local Supabase settings
        # Local demo keys only; staging/production keys never reach CI.
        run: |
          eval "$(npx supabase status -o env)"
          if [ -z "${API_URL}" ] || [ -z "${ANON_KEY}" ] || [ -z "${SERVICE_ROLE_KEY}" ]; then
            echo "supabase status did not provide API_URL, ANON_KEY, and SERVICE_ROLE_KEY" >&2
            exit 1
          fi
          echo "::add-mask::${ANON_KEY}"
          echo "::add-mask::${SERVICE_ROLE_KEY}"
          {
            echo "SUPABASE_URL=${API_URL}"
            echo "SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "AUTH_SECRET=$(openssl rand -hex 32)"
            echo "E2E_REQUIRE_AUTH=1"
          } >> "$GITHUB_ENV"
      - run: npm run test:e2e
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  security:
    name: Bağımlılık ve gizli anahtar denetimi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          # Push/PR runs scan only the new commits; scheduled and manual runs scan all history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit all dependencies (report only, see SECURITY.md accepted risks)
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
